[package]
name = "aspen-uma-helper"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Bounded read-only firmware admission probe for Aspen UMA"

[workspace]
resolver = "3"

[workspace.metadata.octet]
default_scope = ["--workspace"]
cargo_check_args = ["--all-targets", "--all-features"]

[dependencies]
r-efi = "=5.3.0"

[[bin]]
name = "uma-probe"
path = "src/bin/uma-probe.rs"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
