[package]
name = "onix-mesh-research"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
mesh-llm-plugin = { git = "https://github.com/Mesh-LLM/mesh-llm", rev = "c209d1775fec5fcf6ab314628826dfdb0615ea6a" }
reqwest = { version = "=0.13.4", default-features = false, features = ["json"] }
rmcp = { version = "=1.8.0", default-features = false, features = ["server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
