daemon off;
worker_processes 1;
pid /home/brittonr/.ds-iroh/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /home/brittonr/.ds-iroh/client-body;
    proxy_temp_path /home/brittonr/.ds-iroh/proxy-temp;
    client_max_body_size 1m;
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 30s;
    send_timeout 300s;

    map_hash_bucket_size 128;
    map $http_authorization $api_client {
        default "";
        include /home/brittonr/.ds-iroh/api-keys.conf;
    }

    upstream deepseek_backend {
        server 127.0.0.1:8888;
    }

    server {
        listen 127.0.0.1:18888;
        if ($api_client = "") { return 401; }

        proxy_http_version 1.1;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Authorization "";
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;

        location = /v1/models {
            if ($request_method != GET) { return 405; }
            proxy_pass http://deepseek_backend;
        }
        location = /v1/chat/completions {
            if ($request_method != POST) { return 405; }
            proxy_pass http://deepseek_backend;
        }
        location / { return 404; }
    }
}
